name: Build and Push to GHCR

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.set_tag.outputs.IMAGE_NAME }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: | 
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
        
        # steps.meta.outputs.tags => ghcr.io/mercyshark/dempoapp:sha-<commit-sha>
      - name: Set image name output
        id: set_tag
        run: |
          echo "IMAGE_NAME=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
          
  updates-manifest:
    runs-on: ubuntu-latest
    needs: build
    env:
      K8S_REPO: mercyshark/argocd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          repository: ${{ env.K8S_REPO}}
          token: ${{ vars.PAT_TOKEN_FOR_DEMOAPP_TO_ACCESS_ARGOCD_REPO}}
          path: k8s-repo


      - name: Set image tag
        run: echo "TAG=$(echo "${{ needs.build.outputs.image_name }}" | head -n 1)" >> $GITHUB_ENV

      - name: Update K8s manifest image tag   
        run: |
          cd k8s-repo
          sed -i "s|image: .*|image: $TAG|g" k8s/nginx-deployment.yaml

      - name: Commit updated manifest         
        run: |
          cd k8s-repo
          git config user.name "github-actions"
          git config user.email "prajapatirishabh04@gmail.com"
          git add k8s/nginx-deployment.yaml
          git commit -m "Update image tag to $TAG" || echo "No changes"
          git push origin main
